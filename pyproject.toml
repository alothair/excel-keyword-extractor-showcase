[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "excel-keyword-extractor-showcase"
version = "1.0.0"
description = "Deterministic keyword extraction from XLSX and CSV spreadsheets"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "alothair"}]
dependencies = []

[project.scripts]
spreadsheet-keywords = "keyword_extractor.cli:main"
