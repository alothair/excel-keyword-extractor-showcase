<svg xmlns="http://www.w3.org/2000/svg" width="920" height="420" viewBox="0 0 920 420" role="img" aria-labelledby="title desc">
  <title id="title">Synthetic Excel keyword extractor demo</title>
  <desc id="desc">A privacy-safe mock terminal showing keyword extraction results.</desc>
  <rect width="920" height="420" rx="18" fill="#101827"/>
  <rect x="20" y="20" width="880" height="380" rx="12" fill="#162235" stroke="#33445f"/>
  <circle cx="48" cy="48" r="7" fill="#fb7185"/><circle cx="72" cy="48" r="7" fill="#fbbf24"/><circle cx="96" cy="48" r="7" fill="#34d399"/>
  <g font-family="Consolas, monospace" font-size="18" fill="#dbeafe">
    <text x="44" y="92" fill="#7dd3fc">$ python -m keyword_extractor examples/products.csv --top 5</text>
    <text x="44" y="132">source: products.csv</text><text x="44" y="160">documents: 6</text>
    <text x="44" y="208" fill="#a7f3d0">KEYWORD                 SCORE   COUNT</text>
    <text x="44" y="242">mug                    0.0735       4</text>
    <text x="44" y="274">desk                   0.0505       3</text>
    <text x="44" y="306">bottle                 0.0501       2</text>
    <text x="44" y="338">insulated              0.0483       3</text>
    <text x="44" y="370" fill="#94a3b8">Synthetic fixture · deterministic output · no network calls</text>
  </g>
</svg>
