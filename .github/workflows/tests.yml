name: tests

on: [push, pull_request]

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m unittest discover -s tests -v
      - run: python scripts/generate_demo_xlsx.py build/demo.xlsx
      - run: python -m keyword_extractor build/demo.xlsx --columns title description --top 5
